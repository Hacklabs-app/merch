name: Deploy to Cloud Run

on:
  push:
    branches: [main]

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Deploy
        run: |
          gcloud auth configure-docker gcr.io --quiet
          
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }} \
            -t gcr.io/${{ secrets.FIREBASE_PROJECT_ID }}/merch-frontend .
            
          docker push gcr.io/${{ secrets.FIREBASE_PROJECT_ID }}/merch-frontend
          
          gcloud run deploy merch-frontend \
            --image gcr.io/${{ secrets.FIREBASE_PROJECT_ID }}/merch-frontend \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated

